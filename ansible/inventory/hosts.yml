---
# We pipe in the .env vars here, but we have to split them at the '/' because they are CIDR notation
all:
  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            k8s-control-plane:
              ansible_host: "{{ lookup('env', 'TF_VAR_control_plane_ip_cidr').split('/')[0] }}"
        workers:
          hosts:
            k8s-worker:
              ansible_host: "{{ lookup('env', 'TF_VAR_worker_ip_cidr').split('/')[0] }}"
        storage:
          hosts:
            k8s-storage:
              ansible_host: "{{ lookup('env', 'TF_VAR_storage_ip_cidr').split('/')[0] }}"
