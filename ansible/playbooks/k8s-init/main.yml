---
- name: Initialize Kubernetes control plane
  hosts: control_plane
  become: true
  tasks:
    - name: Initialize control plane with kubeadm
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_host }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Apply flannel CNI manifest
      ansible.builtin.command: >
        kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
          --kubeconfig=/etc/kubernetes/admin.conf

    - name: Generate kubeadm join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command

    # Note that this fact is set on the host it runs on, so k8s-control-plane, see hosts.yml
    - name: Save join command as a fact for other hosts
      ansible.builtin.set_fact:
        join_command: "{{ kubeadm_join_command.stdout }}"

- name: Join worker and storage nodes to the cluster
  hosts: workers:storage
  become: true
  tasks:
    - name: Join cluster with kubeadm
      ansible.builtin.command: "{{ hostvars['k8s-control-plane']['join_command'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Create kubeadmin user on control plane
  hosts: control_plane
  become: true
  tasks:
    - name: Create kubeadmin user
      ansible.builtin.user:
        name: kubeadmin
        create_home: yes
        shell: /bin/bash
        password: '*' # no password login

    - name: Install kubeadmin-ed25519 public key
      ansible.posix.authorized_key: # not doing this with lineinfile b.s.
        user: kubeadmin
        key: "{{ lookup( 'file', '/work/keys/kubeadmin/kubeadmin-ed25519.pub') }}"
        state: present

    - name: Create .kube directory
      ansible.builtin.file:
        path: /home/kubeadmin/.kube
        owner: kubeadmin
        group: kubeadmin
        state: directory
        mode: '0700'

    - name: Copy admin.conf
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/kubeadmin/.kube/config
        remote_src: true
        owner: kubeadmin
        group: kubeadmin