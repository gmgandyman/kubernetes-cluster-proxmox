---
# We aren't using the docker version, just Debian's
- name: Install containerd
  apt:
    name: containerd
    state: present

- name: Generate default containerd config
  command: containerd config default
  register: containerd_default_config
  changed_when: false

# Kubernetes docs mandate that if systemd is installed, we must use it's cgroup
- name: Write containerd config with systemd cgroup driver
  copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
  notify: restart containerd

- name: Ensure containerd is enabled and running
  systemd:
    name: containerd
    enabled: true
    state: started